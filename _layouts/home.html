---
layout: default
---
{% if site.notes.size > 0 %}
{% include _includes/notes-tree.html prefix='_notes/' %}
{% endif %}
{% if site.posts.size > 0 %}
<h2>Posts</h2>
<ul>
  {% for post in site.posts %}
  <li><a href="{{ post.url | relative_url }}">{{ post.title | escape }}</a></li>
  {% endfor %}
</ul>
{% endif %}
